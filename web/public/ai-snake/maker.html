<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090d22">
<title>捏皮肤 · AI 贪吃蛇</title>
<style>
  :root { --bg: #090d22; --ink: #eef0ff; --dim: #8e95bd; --warm: #ff8c1a; --gold: #ffd23f; --panel: #11173b; --line: #2c2556; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: radial-gradient(120% 60% at 50% 0%, #1f2150 0%, #0c1230 45%, var(--bg) 100%) fixed; color: var(--ink);
    font: 15px/1.5 -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
  body { max-width: 560px; margin: 0 auto; padding: max(10px, env(safe-area-inset-top)) 12px max(24px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
  h1 span { color: var(--warm); }
  h2 { margin: 0 0 8px; font-size: 14px; color: var(--dim); font-weight: 500; }
  section { margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(17, 23, 59, .72); border: 1px solid var(--line); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { border: 0; border-radius: 10px; padding: 8px 14px; background: #1b2150; color: var(--ink); font-size: 14px; box-shadow: inset 0 -3px 0 #0c1230; text-decoration: none; display: inline-block; }
  .btn.warm { background: var(--warm); color: #1b1418; box-shadow: inset 0 -3px 0 #c4560a; font-weight: 600; }
  .btn.on { background: #2c4499; box-shadow: inset 0 -3px 0 #213a8c; }
  .btn:active { transform: translateY(1px); }
  .btn small { color: var(--dim); }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #preview { width: 100%; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); }
  #grid { width: 100%; max-width: 340px; margin: 0 auto; touch-action: none; border-radius: 6px; cursor: crosshair; }
  input[type=text] { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: #0c1230; color: var(--ink); font-size: 15px; }
  input[type=range] { flex: 1; accent-color: var(--warm); }
  input[type=color] { width: 40px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; }
  label.pick { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 10px; border-radius: 10px; background: #0c1230; font-size: 13px; }
  .swatch { width: 34px; height: 34px; border-radius: 8px; border: 2px solid transparent; box-shadow: 0 0 0 1px var(--line); padding: 0; }
  .swatch.sel { border-color: var(--gold); }
  .swatch.clear { background: repeating-conic-gradient(#3a3f6b 0 25%, #20254d 0 50%) 0 0 / 12px 12px; }
  .swatch.add { background: #1b2150; color: var(--ink); font-size: 20px; }
  .hint { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
  .btn:disabled { opacity: .4; }
  /* 提示浮在屏幕底下，翻到哪儿都看得见 */
  #status { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 9; max-width: 92vw;
    padding: 8px 14px; border-radius: 12px; background: rgba(12, 18, 48, .94); box-shadow: 0 0 0 1px var(--line), 0 6px 18px rgba(0,0,0,.4);
    font-size: 13px; color: var(--gold); text-align: center; }
  #status:empty { display: none; }
  #status.err { color: #ff8a8a; }
  .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }
  .ver { text-align: center; color: var(--dim); font-size: 11px; margin: 14px 0 40px; }
  textarea { width: 100%; min-height: 84px; margin-top: 8px; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: #0c1230; color: var(--ink); font: 12px/1.4 ui-monospace, Menlo, monospace; }
  .slider { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); }
  .slider span:first-child { width: 4.5em; }
  #crop { width: 96px; height: 96px; background: repeating-conic-gradient(#3a3f6b 0 25%, #20254d 0 50%) 0 0 / 12px 12px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); flex: none; }
  .mine { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .mine:first-child { border-top: 0; }
  .mine canvas { width: 30px; height: 30px; }
  .mine b { flex: 1; font-weight: 500; }
  details summary { cursor: pointer; color: var(--dim); font-size: 14px; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; line-height: 1.35; background: #0c1230; padding: 8px; border-radius: 8px; margin: 8px 0 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <h1>捏皮肤 <span>AI 贪吃蛇</span></h1>
    <a class="btn" href="./index.html">← 回游戏</a>
  </header>

  <section>
    <canvas id="preview" width="132" height="82"></canvas>
    <div class="row" style="margin-top:10px">
      <input type="text" id="name" maxlength="8" placeholder="给它起个名字">
    </div>
  </section>

  <section>
    <h2>从哪儿开始</h2>
    <div class="row">
      <button class="btn" data-tpl="empty">空白</button>
      <button class="btn" data-tpl="blank">初始</button>
      <button class="btn" data-tpl="crab">小螃蟹</button>
      <button class="btn warm" id="pick-photo">📷 从图片</button>
      <input type="file" id="file" accept="image/*" class="file-input" tabindex="-1">
    </div>
    <p class="hint">换起头点错了也能撤销回来。</p>
    <div id="photo" class="hidden" style="margin-top:10px">
      <div class="row" style="align-items:flex-start">
        <canvas id="crop" width="96" height="96"></canvas>
        <div style="flex:1; display:flex; flex-direction:column; gap:4px">
          <div class="slider"><span>颜色数</span><input type="range" id="colors" min="3" max="8" value="5"><span id="colors-v">5</span></div>
          <div class="slider"><span>放大</span><input type="range" id="zoom" min="60" max="400" value="100"></div>
          <div class="slider"><span>左右</span><input type="range" id="offx" min="-100" max="100" value="0"></div>
          <div class="slider"><span>上下</span><input type="range" id="offy" min="-100" max="100" value="0"></div>
        </div>
      </div>
      <div class="row" style="margin-top:6px">
        <label class="pick"><input type="checkbox" id="removebg" checked> 去背景</label>
        <label class="pick"><input type="checkbox" id="outline" checked> 描一圈边</label>
      </div>
      <p class="hint">会自动框住图里的主角。只想要头就把「放大」往右拉，再用上下左右对准脸。图片只在你手机上处理，不会传出去。缩到 10×10 格会糊，这只是底稿，下面格子上一格一格修。</p>
    </div>
  </section>

  <section>
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <button class="btn on" data-layer="head">平时</button>
        <button class="btn" data-layer="happy">吃到糖时</button>
        <button class="btn" data-layer="neck">脖子上</button>
      </div>
    </div>
    <div style="margin-top:10px"><canvas id="grid"></canvas></div>
    <div class="row" style="margin-top:10px">
      <button class="btn on" data-tool="pen">画笔</button>
      <button class="btn" data-tool="fill">填充</button>
      <button class="btn" data-tool="pick">吸管</button>
      <button class="btn" id="undo">↶ 撤销</button>
      <button class="btn" id="redo">↷ 重做</button>
    </div>
    <div class="row" id="palette" style="margin-top:10px"></div>
    <input type="color" id="picker" class="hidden">
    <p class="hint" id="layer-hint">点一下颜色选它，选中的再点一下就能换颜色。</p>
  </section>

  <section>
    <h2>身子</h2>
    <div class="row">
      <label class="pick">身子 <input type="color" id="c-body"></label>
      <label class="pick">描边 <input type="color" id="c-edge"></label>
      <label class="pick">名牌 <input type="color" id="c-label"></label>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="pick"><input type="checkbox" id="x-tail"> 尾巴尖 <input type="color" id="c-tail" value="#f7efe6"></label>
      <label class="pick"><input type="checkbox" id="x-dots"> 身上小点 <input type="color" id="c-dots" value="#ffd23f"></label>
      <label class="pick"><input type="checkbox" id="x-legs"> 小腿</label>
      <label class="pick"><input type="checkbox" id="x-hat"> 巫师帽</label>
    </div>
  </section>

  <section>
    <div class="row">
      <button class="btn warm" id="play">存好去玩</button>
      <button class="btn" id="save">只存起来</button>
      <button class="btn" id="share">分享</button>
      <button class="btn" id="paste">粘贴皮肤码</button>
    </div>
    <div id="status"></div>
    <div id="io" class="hidden">
      <textarea id="io-text" spellcheck="false"></textarea>
      <div class="row" style="margin-top:6px">
        <button class="btn" id="io-go">认一下</button>
        <button class="btn" id="io-close">收起</button>
      </div>
    </div>
  </section>

  <section>
    <h2>我的皮肤</h2>
    <div id="mine"><p class="hint">还没有，捏好点「只存起来」</p></div>
  </section>

  <section>
    <details>
      <summary>可编辑的：皮肤码怎么写</summary>
      <p class="hint" style="font-size:13px">皮肤码就是一段 JSON。把下面这段连同你想要的图发给你家的克，让它照着图一格一格写，写好贴进「粘贴皮肤码」。</p>
      <pre id="spec"></pre>
    </details>
  </section>

  <p class="ver">版本 10/30 l</p>
  <script type="module" src="./maker.js?v=20261031c"></script>
</body>
</html>
